<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Vehicle Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Vehicle Data Test</h1>
        <form id="vehicleForm">
            <div class="mb-3">
                <input type="text" id="registration" class="form-control" placeholder="Enter Registration" maxlength="8">
            </div>
            <button type="submit" class="btn btn-primary">Search</button>
        </form>
        
        <div id="results" style="display: none;" class="mt-4">
            <div id="vehicleData"></div>
            <button id="analyzeBtn" class="btn btn-success mt-3" style="display: none;">Analyze</button>
            <div id="analysisResults" style="display: none;" class="mt-3"></div>
        </div>
    </div>

    <script>
        document.getElementById('vehicleForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const reg = document.getElementById('registration').value.trim().toUpperCase();
            if (!reg) return;
            
            fetch('/api/scrape', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({registration: reg})
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showVehicleData(data.data);
                } else {
                    alert('Error: ' + (data.error || 'Failed to get data'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Network error');
            });
        });
        
        function showVehicleData(vehicle) {
            document.getElementById('vehicleData').innerHTML = `
                <h3>${vehicle.make} ${vehicle.model}</h3>
                <p>Year: ${vehicle.year}</p>
                <p>Color: ${vehicle.color}</p>
                <p>V5C Date: ${vehicle.last_v5_issue_date || 'Not Available'}</p>
            `;
            document.getElementById('results').style.display = 'block';
            document.getElementById('analyzeBtn').style.display = 'block';
            
            document.getElementById('analyzeBtn').onclick = function() {
                analyzeVehicle(vehicle.registration);
            };
        }
        
        function analyzeVehicle(reg) {
            fetch('/api/intelligent-analysis', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({registration: reg})
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showAnalysis(data.data);
                } else {
                    alert('Analysis error: ' + (data.error || 'Failed'));
                }
            })
            .catch(error => {
                console.error('Analysis error:', error);
                alert('Analysis network error');
            });
        }
        
        function showAnalysis(analysis) {
            const ownership = analysis.ownership_analysis || {};
            document.getElementById('analysisResults').innerHTML = `
                <div class="alert alert-info">
                    <h5>Analysis Results</h5>
                    <p><strong>V5C Change Date:</strong> ${ownership.last_v5c_change_date || 'Not Available'}</p>
                    <p><strong>Estimated Owners:</strong> ${ownership.estimated_previous_owners || 'Not Available'}</p>
                    <p><strong>Registration Place:</strong> ${ownership.registration_place || 'Not Available'}</p>
                </div>
            `;
            document.getElementById('analysisResults').style.display = 'block';
        }
    </script>
</body>
</html>
