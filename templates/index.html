<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Data Scraper - Comprehensive MOT & Vehicle Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/feather-icons@4.28.0/dist/feather.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            margin: 2rem auto;
            max-width: 1200px;
        }
        
        .search-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px 20px 0 0;
            color: white;
            padding: 3rem 2rem;
        }
        
        .search-box {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            color: white;
            font-size: 1.2rem;
            padding: 1rem 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .search-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            color: white;
            font-weight: 600;
            padding: 1rem 2rem;
            transition: all 0.3s ease;
        }
        
        .search-btn:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
        }
        
        .vehicle-info-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin: 1rem 0;
            overflow: hidden;
        }
        
        .info-header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 1rem 1.5rem;
        }
        
        .info-content {
            padding: 1.5rem;
        }
        
        .info-row {
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            color: #666;
            font-weight: 500;
        }
        
        .info-value {
            color: #333;
            font-weight: 600;
        }
        
        .mot-history-section {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin: 2rem 0;
            overflow: hidden;
        }
        
        .mot-header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 1.5rem;
        }
        
        .mot-summary {
            background: #f8f9fa;
            padding: 1.5rem;
        }
        
        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .stat-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            padding: 1rem;
            text-align: center;
        }
        
        .stat-number {
            color: #667eea;
            font-size: 2rem;
            font-weight: 700;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
        }
        
        .mot-test {
            border-left: 5px solid #ddd;
            margin: 1rem 0;
            padding: 1.5rem;
            position: relative;
        }
        
        .mot-test.passed {
            border-left-color: #28a745;
            background: rgba(40, 167, 69, 0.05);
        }
        
        .mot-test.failed {
            border-left-color: #dc3545;
            background: rgba(220, 53, 69, 0.05);
        }
        
        .mot-test.unknown {
            border-left-color: #ffc107;
            background: rgba(255, 193, 7, 0.05);
        }
        
        .test-badge {
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.3rem 0.8rem;
            position: absolute;
            right: 1rem;
            top: 1rem;
            text-transform: uppercase;
        }
        
        .badge-passed {
            background: #28a745;
            color: white;
        }
        
        .badge-failed {
            background: #dc3545;
            color: white;
        }
        
        .badge-unknown {
            background: #ffc107;
            color: #333;
        }
        
        .test-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }
        
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        
        .detail-label {
            color: #666;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }
        
        .detail-value {
            color: #333;
            font-weight: 600;
        }
        
        .comments-section {
            margin-top: 1rem;
        }
        
        .comment-item {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            margin: 0.5rem 0;
            padding: 0.75rem;
        }
        
        .comment-advisory {
            border-left: 4px solid #ffc107;
        }
        
        .comment-failure {
            border-left: 4px solid #dc3545;
        }
        
        .comment-clean {
            border-left: 4px solid #28a745;
        }
        
        .comment-type {
            color: #666;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
        }
        
        .spinner-border {
            color: #667eea;
            height: 3rem;
            width: 3rem;
        }
        
        .alert-custom {
            border-radius: 15px;
            border: none;
            font-weight: 500;
            margin: 1rem 0;
            padding: 1rem 1.5rem;
        }
        
        .severity-high {
            background: rgba(220, 53, 69, 0.1);
            border-left: 5px solid #dc3545;
            color: #721c24;
        }
        
        .no-data {
            background: #f8f9fa;
            border-radius: 10px;
            color: #666;
            font-style: italic;
            padding: 2rem;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            .main-container {
                margin: 1rem;
            }
            
            .search-section {
                padding: 2rem 1rem;
            }
            
            .test-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="main-container">
            <!-- Search Section -->
            <div class="search-section">
                <div class="text-center mb-4">
                    <h1 class="display-4 mb-3">🚗 Vehicle Data Scraper</h1>
                    <p class="lead">Comprehensive UK Vehicle MOT & History Analysis</p>
                </div>
                
                <form id="vehicleForm" class="row g-3 justify-content-center">
                    <div class="col-md-6">
                        <input type="text" 
                               id="registration" 
                               class="form-control search-box" 
                               placeholder="Enter Registration (e.g., DA07BWF)"
                               maxlength="8"
                               required>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn search-btn w-100">
                            <i data-feather="search"></i> Analyze Vehicle
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- Results Section -->
            <div class="p-4" id="resultsSection" style="display: none;">
                <!-- Vehicle Information Card -->
                <div class="vehicle-info-card" id="vehicleInfo">
                    <div class="info-header">
                        <i data-feather="info"></i> Vehicle Information
                    </div>
                    <div class="info-content" id="vehicleDetails">
                        <!-- Vehicle details will be populated here -->
                    </div>
                    <div class="p-3 border-top">
                        <button id="analyzeWithAI" class="btn btn-success btn-lg w-100" style="display: none;">
                            <i data-feather="zap"></i> 🧠 Analyze with OpenAI GPT-4o
                        </button>
                    </div>
                </div>
                
                <!-- MOT History Section -->
                <div class="mot-history-section" id="motHistorySection">
                    <div class="mot-header">
                        <i data-feather="clipboard"></i> MOT Test History
                    </div>
                    
                    <!-- MOT Summary Stats -->
                    <div class="mot-summary" id="motSummary">
                        <!-- Summary stats will be populated here -->
                    </div>
                    
                    <!-- Individual MOT Tests -->
                    <div class="p-3" id="motTests">
                        <!-- MOT test details will be populated here -->
                    </div>
                </div>
                
                <!-- Mileage Analysis Section -->
                <div class="vehicle-info-card" id="mileageSection">
                    <div class="info-header">
                        <i data-feather="trending-up"></i> Mileage Analysis
                    </div>
                    <div class="info-content" id="mileageAnalysis">
                        <!-- Mileage analysis will be populated here -->
                    </div>
                </div>
            </div>
            
            <!-- Loading Section -->
            <div class="loading" id="loadingSection" style="display: none;">
                <div class="spinner-border" role="status"></div>
                <h4 class="mt-3">Analyzing Vehicle Data...</h4>
                <p class="text-muted">Extracting comprehensive MOT history and vehicle details</p>
            </div>
            
            <!-- Error Section -->
            <div class="p-4" id="errorSection" style="display: none;">
                <div class="alert alert-danger alert-custom" id="errorMessage">
                    <!-- Error message will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.28.0/dist/feather.min.js"></script>
    <script>
        // Initialize Feather Icons
        feather.replace();
        
        document.getElementById('vehicleForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const registration = document.getElementById('registration').value.trim().toUpperCase();
            if (!registration) {
                showError('Please enter a vehicle registration number');
                return;
            }
            
            analyzeVehicle(registration);
        });
        
        async function analyzeVehicle(registration) {
            showLoading();
            
            try {
                const response = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ registration: registration })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayResults(data.data, data.source);
                } else {
                    showError(data.error || 'Failed to analyze vehicle data');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Network error occurred. Please try again.');
            }
        }
        
        function displayResults(vehicleData, source) {
            hideAllSections();
            
            // Display vehicle information
            displayVehicleInfo(vehicleData);
            
            // Display MOT history
            displayMOTHistory(vehicleData.mot_history);
            
            // Display mileage analysis
            displayMileageAnalysis(vehicleData.mileage_history);
            
            // Show and setup OpenAI analysis button
            const analyzeBtn = document.getElementById('analyzeWithAI');
            analyzeBtn.style.display = 'block';
            analyzeBtn.onclick = function() {
                window.location.href = `/analysis/${vehicleData.registration}`;
            };
            
            // Add source indicator
            if (source === 'cache') {
                const cacheIndicator = document.createElement('div');
                cacheIndicator.className = 'alert alert-info alert-custom';
                cacheIndicator.innerHTML = '<i data-feather="database"></i> Data retrieved from cache (updated within 24 hours)';
                document.getElementById('resultsSection').prepend(cacheIndicator);
                feather.replace();
            }
            
            document.getElementById('resultsSection').style.display = 'block';
            feather.replace();
        }
        
        function displayVehicleInfo(vehicleData) {
            const vehicleDetails = document.getElementById('vehicleDetails');
            
            vehicleDetails.innerHTML = `
                <div class="info-row">
                    <span class="info-label">Registration</span>
                    <span class="info-value">${vehicleData.registration || 'Unknown'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Make</span>
                    <span class="info-value">${vehicleData.make || 'Unknown'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Model</span>
                    <span class="info-value">${vehicleData.model || 'Unknown'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Year</span>
                    <span class="info-value">${vehicleData.year || 'Unknown'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Color</span>
                    <span class="info-value">${vehicleData.color || 'Unknown'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Fuel Type</span>
                    <span class="info-value">${vehicleData.fuel_type || 'Unknown'}</span>
                </div>
                <div class="info-row highlight-v5c">
                    <span class="info-label"><i class="fas fa-id-card me-1"></i>Last V5C Change Date</span>
                    <span class="info-value">${vehicleData.v5_issue_date || vehicleData.last_v5_issue_date || (vehicleData.vehicle_details && vehicleData.vehicle_details.last_v5c_issue_date) || 'Not Available'}</span>
                    <small class="text-muted d-block">When current V5C was issued</small>
                </div>
            `;
        }
        
        function displayMOTHistory(motHistory) {
            if (!motHistory || !motHistory.tests || motHistory.tests.length === 0) {
                document.getElementById('motSummary').innerHTML = `
                    <div class="no-data">
                        <i data-feather="info"></i>
                        <h5>No MOT History Available</h5>
                        <p>No MOT test records found for this vehicle.</p>
                    </div>
                `;
                document.getElementById('motTests').innerHTML = '';
                feather.replace();
                return;
            }
            
            // Calculate summary statistics from tests data
            const tests = motHistory.tests || [];
            const totalTests = tests.length;
            const passedTests = tests.filter(test => test.result && test.result.toLowerCase().includes('pass')).length;
            const failedTests = tests.filter(test => test.result && test.result.toLowerCase().includes('fail')).length;
            const advisoryTests = tests.filter(test => test.comments && test.comments.some(comment => 
                comment.toLowerCase().includes('advisory'))).length;
            
            const summaryHtml = `
                <div class="summary-stats">
                    <div class="stat-card">
                        <div class="stat-number">${totalTests}</div>
                        <div class="stat-label">Total Tests</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${passedTests}</div>
                        <div class="stat-label">Passed</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${failedTests}</div>
                        <div class="stat-label">Failed</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${advisoryTests}</div>
                        <div class="stat-label">Advisories</div>
                    </div>
                </div>
            `;
            
            document.getElementById('motSummary').innerHTML = summaryHtml;
            
            // Display individual tests
            const motTestsHtml = motHistory.tests.map(test => {
                const resultClass = test.result ? test.result.toLowerCase() : 'unknown';
                const badgeClass = getBadgeClass(test.result);
                
                const commentsHtml = test.comments && test.comments.length > 0 
                    ? `<div class="comments-section">
                        <h6>Comments & Advisories:</h6>
                        ${test.comments.map(comment => `
                            <div class="comment-item ${getCommentClass(comment)}">
                                <div class="comment-type">${getCommentType(comment)}</div>
                                <div>${comment}</div>
                            </div>
                        `).join('')}
                    </div>`
                    : '';
                
                return `
                    <div class="mot-test ${resultClass}">
                        <span class="test-badge ${badgeClass}">${test.result || 'Unknown'}</span>
                        
                        <div class="test-details">
                            <div class="detail-item">
                                <span class="detail-label">Test Date</span>
                                <span class="detail-value">${test.date || 'Not recorded'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Mileage</span>
                                <span class="detail-value">${test.mileage ? formatMileage(test.mileage) : 'Not recorded'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Expiry Date</span>
                                <span class="detail-value">${test.expiry_date || 'Unknown'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Source</span>
                                <span class="detail-value">${test.source || 'Unknown'}</span>
                            </div>
                        </div>
                        
                        ${commentsHtml}
                    </div>
                `;
            }).join('');
            
            document.getElementById('motTests').innerHTML = motTestsHtml;
        }
        
        function displayMileageAnalysis(mileageHistory) {
            const mileageAnalysis = document.getElementById('mileageAnalysis');
            
            if (!mileageHistory || !mileageHistory.analysis) {
                mileageAnalysis.innerHTML = `
                    <div class="no-data">
                        <i data-feather="trending-up"></i>
                        <h5>No Mileage Analysis Available</h5>
                        <p>No mileage data found for analysis.</p>
                    </div>
                `;
                feather.replace();
                return;
            }
            
            const analysis = mileageHistory.analysis;
            let analysisHtml = '';
            
            // Check for odometer issues
            if (analysis.odometer_issues && analysis.odometer_issues.has_issues) {
                const severity = analysis.odometer_issues.severity || 'UNKNOWN';
                analysisHtml += `
                    <div class="alert-custom severity-high">
                        <h5><i data-feather="alert-triangle"></i> Odometer Discrepancy Detected</h5>
                        <p><strong>Severity:</strong> ${severity}</p>
                        <p><strong>Issue:</strong> ${analysis.odometer_issues.reduction_amount || 'Unknown'} miles reduction</p>
                        <p><strong>Period:</strong> ${analysis.odometer_issues.affected_period || 'Unknown'}</p>
                    </div>
                `;
            }
            
            // Display mileage records if available
            if (mileageHistory.mileage_records && mileageHistory.mileage_records.length > 0) {
                analysisHtml += `
                    <h6>Mileage Records:</h6>
                    <div class="row">
                        ${mileageHistory.mileage_records.map(record => `
                            <div class="col-md-6">
                                <div class="info-row">
                                    <span class="info-label">${record.date || 'Unknown Date'}</span>
                                    <span class="info-value">${formatMileage(record.mileage)}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            
            if (!analysisHtml) {
                analysisHtml = `
                    <div class="no-data">
                        <i data-feather="check-circle"></i>
                        <h5>No Issues Found</h5>
                        <p>No mileage discrepancies or issues detected.</p>
                    </div>
                `;
            }
            
            mileageAnalysis.innerHTML = analysisHtml;
            feather.replace();
        }
        
        function getBadgeClass(result) {
            if (!result) return 'badge-unknown';
            const resultLower = result.toLowerCase();
            if (resultLower.includes('pass')) return 'badge-passed';
            if (resultLower.includes('fail')) return 'badge-failed';
            return 'badge-unknown';
        }
        
        function getCommentClass(comment) {
            if (!comment) return 'comment-clean';
            const text = comment.toLowerCase();
            if (text.includes('advisory')) return 'comment-advisory';
            if (text.includes('fail') || text.includes('major')) return 'comment-failure';
            return 'comment-clean';
        }
        
        function getCommentType(comment) {
            if (!comment) return 'Comment';
            const text = comment.toLowerCase();
            if (text.includes('advisory')) return 'ADVISORY';
            if (text.includes('major')) return 'MAJOR';
            if (text.includes('fail')) return 'FAILURE';
            return 'Note';
        }
        
        function formatMileage(mileage) {
            if (!mileage) return 'Not recorded';
            const number = parseInt(mileage.toString().replace(/,/g, ''));
            return number.toLocaleString() + ' miles';
        }
        
        function showLoading() {
            hideAllSections();
            document.getElementById('loadingSection').style.display = 'block';
        }
        
        function showError(message) {
            hideAllSections();
            document.getElementById('errorMessage').innerHTML = `
                <h5><i data-feather="alert-circle"></i> Error</h5>
                <p>${message}</p>
            `;
            document.getElementById('errorSection').style.display = 'block';
            feather.replace();
        }
        
        function hideAllSections() {
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('loadingSection').style.display = 'none';
            document.getElementById('errorSection').style.display = 'none';
        }
        
        // Auto-format registration input
        document.getElementById('registration').addEventListener('input', function(e) {
            let value = e.target.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
            if (value.length > 8) value = value.substring(0, 8);
            e.target.value = value;
        });
    </script>
</body>
</html>
