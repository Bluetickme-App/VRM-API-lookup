{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">
                    <i class="fas fa-search"></i> Vehicle Registration Lookup
                </h5>
            </div>
            <div class="card-body">
                <form id="searchForm">
                    <div class="mb-3">
                        <label for="registration" class="form-label">Registration Number</label>
                        <input type="text" class="form-control" id="registration" name="registration" 
                               placeholder="Enter vehicle registration (e.g., AB12 ABC)" required>
                        <div class="form-text">Enter a UK vehicle registration number</div>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-search"></i> Search Vehicle
                    </button>
                </form>
                
                <div id="loading" class="loading text-center mt-3">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Searching for vehicle data...</p>
                </div>
                
                <div id="results" class="mt-4" style="display: none;">
                    <!-- Results will be populated here -->
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h6 class="card-title mb-0">
                    <i class="fas fa-database"></i> Database Status
                </h6>
            </div>
            <div class="card-body">
                <div id="dbStatus">
                    <span class="badge bg-success">Connected</span>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h6 class="card-title mb-0">
                    <i class="fas fa-history"></i> Recent Searches
                </h6>
            </div>
            <div class="card-body">
                <div id="recentSearches">
                    <p class="text-muted">No recent searches</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('searchForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const registration = document.getElementById('registration').value.trim();
    const loading = document.getElementById('loading');
    const results = document.getElementById('results');
    
    if (!registration) {
        alert('Please enter a registration number');
        return;
    }
    
    loading.style.display = 'block';
    results.style.display = 'none';
    
    try {
        const response = await fetch('/api/scrape', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ registration: registration })
        });
        
        const data = await response.json();
        
        loading.style.display = 'none';
        results.style.display = 'block';
        
        if (data.success) {
            results.innerHTML = `
                <div class="alert alert-success">
                    <h6><i class="fas fa-check-circle"></i> Vehicle Found</h6>
                    <div class="row">
                        <div class="col-md-6">
                            <strong>Registration:</strong> ${data.registration || 'N/A'}<br>
                            <strong>Make:</strong> ${data.make || 'N/A'}<br>
                            <strong>Model:</strong> ${data.model || 'N/A'}<br>
                            <strong>Year:</strong> ${data.year || 'N/A'}<br>
                            <strong>Color:</strong> ${data.color || 'N/A'}<br>
                        </div>
                        <div class="col-md-6">
                            <strong>Fuel Type:</strong> ${data.fuel_type || 'N/A'}<br>
                            <strong>Engine Size:</strong> ${data.engine_size || 'N/A'}<br>
                            <strong>Transmission:</strong> ${data.transmission || 'N/A'}<br>
                            <strong>Body Style:</strong> ${data.body_style || 'N/A'}<br>
                            ${data.cached ? '<span class="badge bg-info">Cached Data</span>' : ''}
                        </div>
                    </div>
                </div>
            `;
        } else {
            results.innerHTML = `
                <div class="alert alert-danger">
                    <h6><i class="fas fa-exclamation-triangle"></i> Error</h6>
                    <p>${data.error}</p>
                </div>
            `;
        }
    } catch (error) {
        loading.style.display = 'none';
        results.style.display = 'block';
        results.innerHTML = `
            <div class="alert alert-danger">
                <h6><i class="fas fa-exclamation-triangle"></i> Error</h6>
                <p>An error occurred while searching. Please try again.</p>
            </div>
        `;
    }
});

// Load recent searches
async function loadRecentSearches() {
    try {
        const response = await fetch('/api/search-history');
        const data = await response.json();
        
        const container = document.getElementById('recentSearches');
        if (data.length > 0) {
            container.innerHTML = data.slice(0, 5).map(search => `
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span>${search.registration}</span>
                    <span class="badge ${search.success ? 'bg-success' : 'bg-danger'}">
                        ${search.success ? 'Success' : 'Failed'}
                    </span>
                </div>
            `).join('');
        }
    } catch (error) {
        console.error('Error loading recent searches:', error);
    }
}

// Load recent searches on page load
loadRecentSearches();
</script>
{% endblock %}
