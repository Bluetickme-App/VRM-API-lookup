<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Registration Check</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 24px;
            font-weight: 600;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .btn {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn:hover {
            background: #357abd;
        }

        .btn-secondary {
            background: #6c757d;
            margin-top: 15px;
        }

        .btn-secondary:hover {
            background: #545b62;
        }

        .upload-section {
            margin: 30px 0;
            padding: 30px;
            border: 2px dashed #ddd;
            border-radius: 8px;
            background: #fafafa;
        }

        .upload-btn {
            background: #28a745;
            margin-right: 10px;
            display: inline-block;
            width: auto;
            margin-bottom: 0;
        }

        .upload-btn:hover {
            background: #218838;
        }

        .camera-btn {
            background: #17a2b8;
            display: inline-block;
            width: auto;
            margin-bottom: 0;
        }

        .camera-btn:hover {
            background: #138496;
        }

        .results {
            display: none;
            margin-top: 30px;
            text-align: left;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            background: #f8f9fa;
        }

        .history-section {
            display: none;
            margin-top: 20px;
            text-align: left;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            background: #f8f9fa;
        }

        .history-item {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            background: white;
            transition: all 0.3s;
        }

        .history-item:hover {
            background: #e3f2fd;
            border-color: #4a90e2;
        }

        .loading {
            display: none;
            color: #666;
            font-style: italic;
        }

        .error {
            color: #dc3545;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
        }

        .success {
            color: #155724;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .vehicle-info {
            margin: 10px 0;
        }

        .vehicle-info strong {
            color: #333;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            .upload-btn, .camera-btn {
                width: 100%;
                margin: 5px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vehicle Registration Check</h1>
        <p class="subtitle">Check Vehicle Data</p>

        <!-- Registration Input -->
        <div class="input-group">
            <input type="text" id="registration" placeholder="Enter vehicle registration (e.g. ABC123)" maxlength="8">
        </div>
        <button class="btn" onclick="checkVehicle()">Check Vehicle Data</button>

        <!-- Upload Section -->
        <div class="upload-section">
            <button class="btn upload-btn" onclick="uploadImage()">📁 Upload Number Plate Image</button>
            <button class="btn camera-btn" onclick="takePhoto()">📷 Take Photo of Plate</button>
        </div>

        <!-- History Button -->
        <button class="btn btn-secondary" onclick="loadHistory()">📋 Load Previous Searches</button>

        <!-- Loading -->
        <div class="loading" id="loading">🔄 Processing...</div>

        <!-- Error -->
        <div class="error" id="error"></div>

        <!-- History Section -->
        <div class="history-section" id="historySection">
            <h3>Previous Searches</h3>
            <div id="historyContainer"></div>
        </div>

        <!-- Results -->
        <div class="results" id="results">
            <h3>Vehicle Information</h3>
            <div id="vehicleData"></div>
            <button class="btn" onclick="analyzeVehicle()" style="margin-top: 15px;">🧠 Analyze with AI</button>
        </div>

        <!-- Camera Modal (hidden) -->
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="processImage(this.files[0])">
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="processImage(this.files[0])">
    </div>

    <script>
        var currentRegistration = '';

        function checkVehicle() {
            var registration = document.getElementById('registration').value.trim().toUpperCase();
            if (!registration) {
                showError('Please enter a vehicle registration');
                return;
            }
            
            currentRegistration = registration;
            showLoading(true);
            hideResults();

            fetch('/api/scrape', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ registration: registration })
            })
            .then(response => response.json())
            .then(data => {
                showLoading(false);
                if (data.success) {
                    displayVehicleData(data.data);
                } else {
                    showError(data.error || 'Vehicle not found');
                }
            })
            .catch(error => {
                showLoading(false);
                showError('Network error: ' + error.message);
            });
        }

        function displayVehicleData(data) {
            var html = '';
            
            if (data.make) html += '<div class="vehicle-info"><strong>Make:</strong> ' + data.make + '</div>';
            if (data.model) html += '<div class="vehicle-info"><strong>Model:</strong> ' + data.model + '</div>';
            if (data.year) html += '<div class="vehicle-info"><strong>Year:</strong> ' + data.year + '</div>';
            if (data.color) html += '<div class="vehicle-info"><strong>Color:</strong> ' + data.color + '</div>';
            if (data.fuel_type) html += '<div class="vehicle-info"><strong>Fuel:</strong> ' + data.fuel_type + '</div>';
            if (data.transmission) html += '<div class="vehicle-info"><strong>Transmission:</strong> ' + data.transmission + '</div>';
            if (data.engine_size) html += '<div class="vehicle-info"><strong>Engine:</strong> ' + data.engine_size + '</div>';
            if (data.body_style) html += '<div class="vehicle-info"><strong>Body Style:</strong> ' + data.body_style + '</div>';
            
            if (data.mot_history && data.mot_history.tests) {
                html += '<div class="vehicle-info"><strong>MOT Tests:</strong> ' + data.mot_history.tests.length + '</div>';
            }
            
            document.getElementById('vehicleData').innerHTML = html;
            document.getElementById('results').style.display = 'block';
        }

        function analyzeVehicle() {
            if (!currentRegistration) return;
            
            showLoading(true);
            
            fetch('/api/intelligent-analysis', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ registration: currentRegistration })
            })
            .then(response => response.json())
            .then(data => {
                showLoading(false);
                if (data.success) {
                    showSuccess('Analysis completed successfully!');
                } else {
                    showError('Analysis failed: ' + (data.error || 'Unknown error'));
                }
            })
            .catch(error => {
                showLoading(false);
                showError('Analysis error: ' + error.message);
            });
        }

        function loadHistory() {
            fetch('/api/user-history')
            .then(response => response.json())
            .then(data => {
                if (data.success && data.history.length > 0) {
                    displayHistory(data.history);
                    document.getElementById('historySection').style.display = 'block';
                } else {
                    document.getElementById('historyContainer').innerHTML = '<p style="color: #666;">No previous searches found</p>';
                    document.getElementById('historySection').style.display = 'block';
                }
            })
            .catch(error => {
                showError('Error loading history: ' + error.message);
            });
        }

        function displayHistory(history) {
            var html = '';
            
            history.forEach(function(item) {
                var date = new Date(item.lookup_date).toLocaleDateString();
                html += '<div class="history-item" onclick="searchFromHistory(\'' + item.registration + '\')">';
                html += '<div><strong>' + item.registration + '</strong></div>';
                html += '<div style="font-size: 14px; color: #666;">' + item.make + ' ' + item.model;
                if (item.year) html += ' (' + item.year + ')';
                html += '</div>';
                html += '<div style="font-size: 12px; color: #999;">' + date;
                if (item.analysis_requested) html += ' • Analyzed';
                html += '</div>';
                html += '</div>';
            });
            
            document.getElementById('historyContainer').innerHTML = html;
        }

        function searchFromHistory(registration) {
            document.getElementById('registration').value = registration;
            checkVehicle();
        }

        function uploadImage() {
            document.getElementById('fileInput').click();
        }

        function takePhoto() {
            document.getElementById('cameraInput').click();
        }

        function processImage(file) {
            if (!file) return;
            
            showLoading(true);
            
            var formData = new FormData();
            formData.append('image', file);
            
            fetch('/api/ocr', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                showLoading(false);
                if (data.success && data.registration) {
                    document.getElementById('registration').value = data.registration;
                    showSuccess('Number plate detected: ' + data.registration);
                } else {
                    showError('Could not detect number plate from image');
                }
            })
            .catch(error => {
                showLoading(false);
                showError('Image processing error: ' + error.message);
            });
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            var errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(function() {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            var successDiv = document.createElement('div');
            successDiv.className = 'success';
            successDiv.textContent = message;
            document.querySelector('.container').insertBefore(successDiv, document.getElementById('results'));
            setTimeout(function() {
                successDiv.remove();
            }, 3000);
        }

        function hideResults() {
            document.getElementById('results').style.display = 'none';
            document.getElementById('historySection').style.display = 'none';
        }

        // Auto-format registration input
        document.getElementById('registration').addEventListener('input', function(e) {
            var value = e.target.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
            if (value.length > 8) value = value.substring(0, 8);
            e.target.value = value;
        });

        // Enter key support
        document.getElementById('registration').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkVehicle();
            }
        });
    </script>
</body>
</html>
