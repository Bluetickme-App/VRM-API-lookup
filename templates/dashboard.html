<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Intelligence Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/feather-icons@4.29.0/dist/feather.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .dashboard-header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .search-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .history-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .vehicle-result {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .analysis-result {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .input-group {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .form-control {
            border: none;
            padding: 15px 20px;
            font-size: 16px;
        }
        
        .btn-primary {
            border: none;
            background: linear-gradient(45deg, #667eea, #764ba2);
            padding: 15px 25px;
            font-weight: 600;
        }
        
        .btn-success {
            border: none;
            background: linear-gradient(45deg, #56ab2f, #a8e6cf);
            color: #333;
            padding: 10px 20px;
            font-weight: 600;
        }
        
        .history-item {
            background: rgba(102, 126, 234, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .history-item:hover {
            background: rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }
        
        .analysis-section {
            border-left: 4px solid;
            padding: 15px;
            margin: 10px 0;
            border-radius: 0 8px 8px 0;
        }
        
        .trade-recommend {
            border-color: #28a745;
            background: rgba(40, 167, 69, 0.1);
        }
        
        .trade-avoid {
            border-color: #dc3545;
            background: rgba(220, 53, 69, 0.1);
        }
        
        .trade-consider {
            border-color: #ffc107;
            background: rgba(255, 193, 7, 0.1);
        }
        
        .risk-low {
            border-color: #28a745;
            background: rgba(40, 167, 69, 0.1);
        }
        
        .risk-moderate {
            border-color: #ffc107;
            background: rgba(255, 193, 7, 0.1);
        }
        
        .risk-high {
            border-color: #dc3545;
            background: rgba(220, 53, 69, 0.1);
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner-border {
            color: #667eea;
        }
        
        .hidden {
            display: none;
        }
        
        @media (max-width: 768px) {
            .dashboard-container {
                padding: 10px;
            }
            
            .dashboard-header,
            .search-section,
            .history-section,
            .vehicle-result,
            .analysis-result {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <div class="dashboard-header text-center">
            <h1 class="mb-3">Vehicle Intelligence Dashboard</h1>
            <p class="text-muted">Comprehensive UK vehicle data analysis with AI-powered insights</p>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <h3 class="mb-4">Vehicle Lookup</h3>
            <form id="searchForm">
                <div class="input-group mb-3">
                    <input type="text" id="registrationInput" class="form-control" 
                           placeholder="Enter UK registration (e.g., AB12 CDE)" 
                           pattern="[A-Za-z0-9\s]{1,8}" maxlength="8" required>
                    <button type="submit" class="btn btn-primary">
                        <i data-feather="search"></i> Search Vehicle
                    </button>
                </div>
            </form>
            
            <div id="loading" class="loading">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Searching...</span>
                </div>
                <p class="mt-2">Analyzing vehicle data...</p>
            </div>
        </div>

        <!-- Recent Lookups -->
        <div class="history-section">
            <h3 class="mb-4">Recent Lookups</h3>
            <div id="historyContainer">
                <p class="text-muted">Your recent vehicle searches will appear here</p>
            </div>
            <button id="loadHistoryBtn" class="btn btn-outline-primary btn-sm">
                <i data-feather="clock"></i> Load History
            </button>
        </div>

        <!-- Vehicle Results -->
        <div id="vehicleResult" class="vehicle-result hidden">
            <h3 class="mb-4">Vehicle Information</h3>
            <div id="vehicleDetails"></div>
            <button id="analyzeBtn" class="btn btn-success mt-3">
                <i data-feather="brain"></i> Analyze with AI
            </button>
        </div>

        <!-- Analysis Results -->
        <div id="analysisResult" class="analysis-result hidden">
            <h3 class="mb-4">AI Analysis Results</h3>
            <div id="analysisDetails"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.0/dist/feather.min.js"></script>
    <script>
        // Initialize Feather icons
        feather.replace();

        var currentVehicleData = null;

        // Search form submission
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var registration = document.getElementById('registrationInput').value.trim().toUpperCase();
            if (registration) {
                searchVehicle(registration);
            }
        });

        // Analyze button
        document.getElementById('analyzeBtn').addEventListener('click', function() {
            if (currentVehicleData) {
                analyzeVehicle(currentVehicleData.registration);
            }
        });

        // Load history button
        document.getElementById('loadHistoryBtn').addEventListener('click', loadUserHistory);

        function searchVehicle(registration) {
            showLoading(true);
            hideResults();

            fetch('/api/scrape', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ registration: registration })
            })
            .then(response => response.json())
            .then(data => {
                showLoading(false);
                if (data.success) {
                    currentVehicleData = data.data;
                    displayVehicleData(data.data);
                    loadUserHistory(); // Refresh history
                } else {
                    showError('Vehicle not found: ' + (data.error || 'Unknown error'));
                }
            })
            .catch(error => {
                showLoading(false);
                showError('Search failed: ' + error.message);
            });
        }

        function analyzeVehicle(registration) {
            var analyzeBtn = document.getElementById('analyzeBtn');
            analyzeBtn.disabled = true;
            analyzeBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Analyzing...';

            fetch('/api/intelligent-analysis', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ registration: registration })
            })
            .then(response => response.json())
            .then(data => {
                analyzeBtn.disabled = false;
                analyzeBtn.innerHTML = '<i data-feather="brain"></i> Analyze with AI';
                feather.replace();

                if (data.success) {
                    displayAnalysisData(data.analysis);
                } else {
                    showError('Analysis failed: ' + (data.error || 'Unknown error'));
                }
            })
            .catch(error => {
                analyzeBtn.disabled = false;
                analyzeBtn.innerHTML = '<i data-feather="brain"></i> Analyze with AI';
                feather.replace();
                showError('Analysis failed: ' + error.message);
            });
        }

        function loadUserHistory() {
            fetch('/api/user-history')
            .then(response => response.json())
            .then(data => {
                if (data.success && data.history.length > 0) {
                    displayHistory(data.history);
                } else {
                    document.getElementById('historyContainer').innerHTML = 
                        '<p class="text-muted">No recent searches found</p>';
                }
            })
            .catch(error => {
                console.error('Error loading history:', error);
            });
        }

        function displayHistory(history) {
            var container = document.getElementById('historyContainer');
            var html = '';

            history.forEach(function(item) {
                var date = new Date(item.lookup_date).toLocaleDateString();
                html += '<div class="history-item" onclick="searchVehicle(\'' + item.registration + '\')">';
                html += '<div class="row">';
                html += '<div class="col-md-8">';
                html += '<h6 class="mb-1">' + item.registration + '</h6>';
                html += '<p class="mb-1">' + item.make + ' ' + item.model + ' (' + item.year + ')</p>';
                html += '</div>';
                html += '<div class="col-md-4 text-end">';
                html += '<small class="text-muted">' + date + '</small>';
                if (item.analysis_requested) {
                    html += '<br><small class="text-success">✓ Analyzed</small>';
                }
                html += '</div>';
                html += '</div>';
                html += '</div>';
            });

            container.innerHTML = html;
        }

        function displayVehicleData(data) {
            var container = document.getElementById('vehicleDetails');
            var html = '<div class="row">';
            
            // Basic info
            html += '<div class="col-md-6">';
            html += '<h5>Basic Information</h5>';
            html += '<p><strong>Registration:</strong> ' + data.registration + '</p>';
            html += '<p><strong>Make:</strong> ' + data.make + '</p>';
            html += '<p><strong>Model:</strong> ' + data.model + '</p>';
            html += '<p><strong>Year:</strong> ' + data.year + '</p>';
            html += '<p><strong>Color:</strong> ' + data.color + '</p>';
            html += '<p><strong>Fuel Type:</strong> ' + data.fuel_type + '</p>';
            html += '</div>';
            
            // Additional info
            html += '<div class="col-md-6">';
            html += '<h5>Additional Details</h5>';
            html += '<p><strong>Transmission:</strong> ' + (data.transmission || 'Unknown') + '</p>';
            html += '<p><strong>Engine Size:</strong> ' + (data.engine_size || 'Unknown') + '</p>';
            html += '<p><strong>Body Style:</strong> ' + (data.body_style || 'Unknown') + '</p>';
            if (data.last_v5_issue_date) {
                html += '<p><strong>Last V5C Date:</strong> ' + data.last_v5_issue_date + '</p>';
            }
            html += '</div>';
            
            html += '</div>';
            
            // MOT Info
            if (data.mot_history && data.mot_history.tests) {
                html += '<hr><h5>MOT History</h5>';
                html += '<p><strong>Total Tests:</strong> ' + data.mot_history.tests.length + '</p>';
                if (data.mot_history.summary) {
                    html += '<p><strong>Pass Rate:</strong> ' + 
                        Math.round((data.mot_history.summary.total_passed / data.mot_history.summary.total_tests) * 100) + '%</p>';
                }
            }
            
            container.innerHTML = html;
            document.getElementById('vehicleResult').classList.remove('hidden');
        }

        function displayAnalysisData(analysis) {
            var container = document.getElementById('analysisDetails');
            var html = '';

            // Dynamic analysis display based on available data
            if (analysis.trade_recommendation) {
                var recommendation = analysis.trade_recommendation.recommendation || 'CONSIDER';
                var tradeClass = 'trade-' + recommendation.toLowerCase();
                
                html += '<div class="analysis-section ' + tradeClass + '">';
                html += '<h5><i data-feather="trending-up"></i> Trade Recommendation</h5>';
                html += '<p><strong>Recommendation:</strong> ' + recommendation + '</p>';
                if (analysis.trade_recommendation.reasoning) {
                    html += '<p><strong>Reasoning:</strong> ' + analysis.trade_recommendation.reasoning + '</p>';
                }
                if (analysis.trade_recommendation.cap_tier) {
                    html += '<p><strong>CAP Tier:</strong> ' + analysis.trade_recommendation.cap_tier + '</p>';
                }
                html += '</div>';
            }

            if (analysis.risk_assessment) {
                var risk = (analysis.risk_assessment.mechanical_risk || 'moderate').toLowerCase();
                var riskClass = 'risk-' + risk;
                
                html += '<div class="analysis-section ' + riskClass + '">';
                html += '<h5><i data-feather="alert-triangle"></i> Risk Assessment</h5>';
                html += '<p><strong>Mechanical Risk:</strong> ' + (analysis.risk_assessment.mechanical_risk || 'Unknown') + '</p>';
                if (analysis.risk_assessment.failure_probability) {
                    html += '<p><strong>Failure Probability:</strong> ' + 
                        Math.round(analysis.risk_assessment.failure_probability * 100) + '%</p>';
                }
                html += '</div>';
            }

            if (analysis.cost_analysis) {
                html += '<div class="analysis-section">';
                html += '<h5><i data-feather="pound-sterling"></i> Cost Analysis</h5>';
                if (analysis.cost_analysis.estimated_repairs) {
                    html += '<p><strong>Estimated Repairs:</strong> £' + analysis.cost_analysis.estimated_repairs + '</p>';
                }
                if (analysis.cost_analysis.annual_maintenance) {
                    html += '<p><strong>Annual Maintenance:</strong> £' + analysis.cost_analysis.annual_maintenance + '</p>';
                }
                html += '</div>';
            }

            if (analysis.market_analysis) {
                html += '<div class="analysis-section">';
                html += '<h5><i data-feather="bar-chart-2"></i> Market Analysis</h5>';
                if (analysis.market_analysis.demand_level) {
                    html += '<p><strong>Demand Level:</strong> ' + analysis.market_analysis.demand_level + '</p>';
                }
                if (analysis.market_analysis.market_position) {
                    html += '<p><strong>Market Position:</strong> ' + analysis.market_analysis.market_position + '</p>';
                }
                html += '</div>';
            }

            if (analysis.ownership_analysis) {
                html += '<div class="analysis-section">';
                html += '<h5><i data-feather="users"></i> Ownership Analysis</h5>';
                if (analysis.ownership_analysis.estimated_owners) {
                    html += '<p><strong>Estimated Owners:</strong> ' + analysis.ownership_analysis.estimated_owners + '</p>';
                }
                if (analysis.ownership_analysis.ownership_pattern) {
                    html += '<p><strong>Ownership Pattern:</strong> ' + analysis.ownership_analysis.ownership_pattern + '</p>';
                }
                html += '</div>';
            }

            // Fallback for any unstructured data
            if (!html && analysis.vehicle_assessment) {
                html += '<div class="analysis-section">';
                html += '<h5><i data-feather="info"></i> Vehicle Assessment</h5>';
                for (var key in analysis.vehicle_assessment) {
                    html += '<p><strong>' + key.replace(/_/g, ' ').toUpperCase() + ':</strong> ' + 
                           analysis.vehicle_assessment[key] + '</p>';
                }
                html += '</div>';
            }

            if (!html) {
                html = '<p class="text-muted">Analysis completed but results are in an unexpected format. Please contact support.</p>';
            }

            container.innerHTML = html;
            feather.replace();
            document.getElementById('analysisResult').classList.remove('hidden');
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function hideResults() {
            document.getElementById('vehicleResult').classList.add('hidden');
            document.getElementById('analysisResult').classList.add('hidden');
        }

        function showError(message) {
            var container = document.getElementById('vehicleResult');
            container.innerHTML = '<div class="alert alert-danger" role="alert">' + message + '</div>';
            container.classList.remove('hidden');
        }

        // Load history on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadUserHistory();
        });
    </script>
</body>
</html>
